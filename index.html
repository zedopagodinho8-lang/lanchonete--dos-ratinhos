<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ratinhos">
  <meta name="theme-color" content="#E8722A">
  <title>Lanchonete dos Ratinhos 🐭🧀</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --laranja: #E8722A;
      --laranja-escuro: #C4581A;
      --laranja-claro: #FFB672;
      --creme: #FFF6E9;
      --marrom: #5A3A22;
      --queijo: #FFD166;
      --rosa-nariz: #F27A9E;
      --verde-ok: #4C9A5A;
      --cor-paes: #C4712B;
      --cor-doces: #D9628E;
      --cor-bebidas: #3C8FA8;
      --cor-despensa: #6E9B4E;
      --dourado: #E8B23C;
      --cor-suporte: #7C6BAE;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      position: fixed;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--creme);
      color: var(--marrom);
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
    }

    main {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      padding-top: 0;
      padding-bottom: 0;
    }

    h1, h2, h3 {
      font-family: 'Baloo 2', sans-serif;
      margin: 0;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      border: none;
      -webkit-user-select: none;
      user-select: none;
      padding: 0;
    }

    input, select, textarea {
      font-size: 16px;
      font-family: inherit;
      -webkit-user-select: text;
      user-select: text;
      border-radius: 8px;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--laranja) !important;
    }

    /* ========== FAIXA PROMOCIONAL ========== */
    .faixa-promo {
      background: linear-gradient(90deg, var(--marrom), var(--laranja-escuro));
      color: #f3e3d1;
      font-size: 0.7rem;
      font-weight: 700;
      padding: max(8px, env(safe-area-inset-top)) 12px;
      letter-spacing: 0.2px;
      text-align: center;
      white-space: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .faixa-promo::-webkit-scrollbar {
      display: none;
    }

    .faixa-promo span {
      opacity: 0.55;
      margin: 0 8px;
    }

    /* ========== HEADER ========== */
    header {
      background: linear-gradient(135deg, var(--laranja) 0%, var(--laranja-escuro) 100%);
      color: #fff;
      padding: 12px 16px 10px;
      box-shadow: 0 4px 12px rgba(90,58,34,0.15);
      position: relative;
      z-index: 99;
    }

    .header-linha {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Baloo 2', sans-serif;
      font-size: 1rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    .logo .queijo-icone {
      background: var(--queijo);
      color: var(--marrom);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      border: 2px solid #fff;
      flex-shrink: 0;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    }

    .logo small {
      display: block;
      font-family: 'Nunito', sans-serif;
      font-weight: 600;
      font-size: 0.55rem;
      opacity: 0.9;
      letter-spacing: 0.3px;
    }

    nav.acoes {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-nav {
      background: rgba(255,255,255,0.2);
      color: #fff;
      padding: 8px 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.7rem;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: 0.15s;
      border: 1px solid rgba(255,255,255,0.3);
      min-height: 36px;
      min-width: 36px;
      justify-content: center;
    }

    .btn-nav:active {
      background: rgba(255,255,255,0.35);
      transform: scale(0.95);
    }

    .btn-carrinho {
      background: var(--queijo);
      color: var(--marrom);
      border: none;
      position: relative;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    }

    .btn-carrinho:active {
      background: #ffcb4d;
    }

    .contador-carrinho {
      position: absolute;
      top: -8px;
      right: -8px;
      background: var(--rosa-nariz);
      color: #fff;
      font-size: 0.6rem;
      font-weight: 800;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .contador-carrinho.pulso {
      animation: pulsoContador 0.45s ease;
    }

    @keyframes pulsoContador {
      0% { transform: scale(1); }
      40% { transform: scale(1.4); background: var(--verde-ok); }
      100% { transform: scale(1); }
    }

    .barra-busca {
      max-width: 1200px;
      margin: 8px auto 0;
      display: flex;
      align-items: center;
      background: #fff;
      border-radius: 999px;
      padding: 8px 14px;
      gap: 8px;
      box-shadow: inset 0 0 0 2px rgba(232,114,42,0.15);
    }

    .barra-busca input {
      border: none;
      outline: none;
      flex: 1;
      font-size: 16px;
      color: var(--marrom);
      background: transparent;
      padding: 0;
      height: 32px;
    }

    .barra-busca input::placeholder {
      color: rgba(90,58,34,0.4);
    }

    .barra-busca span {
      color: var(--laranja);
      font-size: 1rem;
      flex-shrink: 0;
    }

    /* ========== HERO ========== */
    .hero {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px 16px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .hero-texto {
      flex: 1 1 280px;
    }

    .aviso-escolar {
      display: inline-block;
      background: #FFEFD9;
      color: var(--laranja-escuro);
      font-weight: 800;
      font-size: 0.65rem;
      padding: 5px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
      letter-spacing: 0.2px;
      border: 1px dashed var(--laranja);
    }

    .hero-texto h1 {
      font-size: 1.6rem;
      line-height: 1.25;
      margin: 8px 0;
      color: var(--laranja-escuro);
    }

    .hero-texto p {
      font-size: 0.9rem;
      line-height: 1.5;
      max-width: 480px;
      color: rgba(90,58,34,0.8);
      margin: 8px 0;
    }

    .hero-stats {
      display: flex;
      gap: 12px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .hero-stats .stat {
      display: flex;
      flex-direction: column;
      background: rgba(255,255,255,0.6);
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(232,114,42,0.2);
    }

    .hero-stats .stat b {
      font-size: 1rem;
      color: var(--laranja-escuro);
      font-family: 'Baloo 2', sans-serif;
    }

    .hero-stats .stat span {
      font-size: 0.65rem;
      color: rgba(90,58,34,0.7);
    }

    .hero-botoes {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .btn-principal {
      background: linear-gradient(135deg, var(--laranja) 0%, var(--laranja-escuro) 100%);
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.85rem;
      box-shadow: 0 4px 12px rgba(232,114,42,0.3);
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 40px;
    }

    .btn-principal:active {
      transform: scale(0.95);
      box-shadow: 0 2px 6px rgba(232,114,42,0.2);
    }

    .btn-secundario {
      background: #fff;
      color: var(--laranja-escuro);
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.85rem;
      border: 2px solid var(--laranja-claro);
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 40px;
    }

    .btn-secundario:active {
      background: #FFF1E0;
      transform: scale(0.95);
    }

    .hero-mascote {
      flex: 1 1 220px;
      display: flex;
      justify-content: center;
      min-height: 250px;
    }

    .balao-mascote {
      background: #fff;
      border-radius: 20px;
      padding: 20px 16px;
      text-align: center;
      box-shadow: 0 12px 24px rgba(90,58,34,0.15);
      border: 3px solid var(--queijo);
      max-width: 280px;
      position: relative;
      animation: flutuar 3.5s ease-in-out infinite;
    }

    @keyframes flutuar {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .balao-mascote .rato-grande {
      font-size: 3rem;
      display: block;
      margin-bottom: 4px;
    }

    .balao-mascote p {
      font-size: 0.8rem;
      font-style: italic;
      margin: 4px 0 0;
      color: var(--marrom);
      line-height: 1.3;
    }

    /* ========== FAIXA DE CONFIANÇA ========== */
    .faixa-confianca {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px 8px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px;
    }

    .item-confianca {
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 2px 8px rgba(90,58,34,0.08);
      border: 1px solid #FFE6C7;
    }

    .item-confianca .icone-confianca {
      font-size: 1.8rem;
      margin-bottom: 6px;
    }

    .item-confianca .texto-confianca b {
      display: block;
      font-size: 0.75rem;
      color: var(--marrom);
      margin-bottom: 2px;
    }

    .item-confianca .texto-confianca span {
      font-size: 0.62rem;
      color: #a0805f;
    }

    /* ========== ABAS PRINCIPAIS ========== */
    .abas-principais {
      background: #fff;
      display: flex;
      justify-content: center;
      gap: 4px;
      padding: 6px;
      box-shadow: 0 2px 8px rgba(90,58,34,0.08);
      border-bottom: 1px solid #FFE6C7;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .abas-principais::-webkit-scrollbar {
      height: 3px;
    }

    .aba-item {
      background: transparent;
      color: #a0805f;
      font-weight: 800;
      font-size: 0.75rem;
      padding: 8px 12px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: 0.15s;
      border: none;
      white-space: nowrap;
      min-height: 36px;
    }

    .aba-item .aba-emoji {
      font-size: 1rem;
    }

    .aba-item:active {
      background: #FFF3E0;
    }

    .aba-item.ativa {
      background: linear-gradient(135deg, var(--laranja) 0%, var(--laranja-escuro) 100%);
      color: #fff;
      box-shadow: 0 4px 10px rgba(232,114,42,0.3);
    }

    .conteudo-aba {
      display: none;
    }

    .conteudo-aba.ativa {
      display: block;
      animation: surgirAba 0.25s ease both;
    }

    @keyframes surgirAba {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ========== SEÇÕES GERAIS ========== */
    section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    .titulo-secao {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .titulo-secao h2 {
      font-size: 1.4rem;
      color: var(--laranja-escuro);
    }

    .subtitulo-secao {
      color: #8a6a4f;
      font-size: 0.85rem;
      margin: 0 0 14px;
    }

    /* ========== ORDENAR E FILTRAR ========== */
    .barra-ordenar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .barra-ordenar label {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--laranja-escuro);
      white-space: nowrap;
    }

    .barra-ordenar select {
      padding: 9px 10px;
      border: 2px solid #FFE1B8;
      background: #fff;
      color: var(--marrom);
      font-weight: 700;
      font-size: 0.8rem;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
      flex: 1;
      min-width: 150px;
    }

    .barra-ordenar select:focus {
      border-color: var(--laranja);
    }

    /* ========== CHIPS DE PREÇO ========== */
    .chips-preco {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
      margin-bottom: 12px;
    }

    .chips-preco::-webkit-scrollbar {
      height: 3px;
    }

    .chip-preco {
      flex-shrink: 0;
      background: #fff;
      border: 2px solid #E7E0EE;
      color: var(--marrom);
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.7rem;
      transition: 0.15s;
      white-space: nowrap;
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chip-preco:active {
      border-color: var(--laranja-claro);
      transform: scale(0.95);
    }

    .chip-preco.ativo {
      background: var(--marrom);
      border-color: var(--marrom);
      color: #fff;
      box-shadow: 0 4px 10px rgba(90,58,34,0.2);
    }

    /* ========== BARRA DE CATEGORIAS ========== */
    .barra-categorias {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 8px 0 10px;
      margin-bottom: 10px;
    }

    .barra-categorias::-webkit-scrollbar {
      height: 3px;
    }

    .btn-categoria {
      flex-shrink: 0;
      background: #fff;
      border: 2px solid #FFE1B8;
      color: var(--marrom);
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.75rem;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: 0.15s;
      white-space: nowrap;
      min-height: 34px;
    }

    .btn-categoria:active {
      border-color: var(--laranja-claro);
      transform: scale(0.95);
    }

    .btn-categoria.ativo {
      background: var(--laranja);
      border-color: var(--laranja);
      color: #fff;
      box-shadow: 0 2px 8px rgba(90,58,34,0.1);
    }

    .btn-categoria .bolinha {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    /* ========== GRID CARDÁPIO ========== */
    #cardapio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }

    @media (max-width: 480px) {
      #cardapio-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
    }

    .card-produto {
      background: #fff;
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 2px 8px rgba(90,58,34,0.08);
      border: 2px solid #FFE6C7;
      display: flex;
      flex-direction: column;
      transition: 0.15s;
      position: relative;
      overflow: hidden;
      animation: surgirCard 0.3s ease both;
    }

    @keyframes surgirCard {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card-produto::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: var(--cor-categoria, var(--laranja));
    }

    .card-produto:active {
      transform: scale(0.96);
      box-shadow: 0 6px 14px rgba(90,58,34,0.12);
    }

    .selo-destaque {
      position: absolute;
      top: 6px;
      right: 6px;
      background: var(--dourado);
      color: #5A3A22;
      font-size: 0.55rem;
      font-weight: 800;
      padding: 3px 6px;
      border-radius: 999px;
      box-shadow: 0 2px 6px rgba(232,178,60,0.4);
      z-index: 2;
    }

    .avaliacao-produto {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 0.6rem;
      color: #a0805f;
      margin-bottom: 4px;
    }

    .avaliacao-produto .queijinhos {
      letter-spacing: 0.4px;
      font-size: 0.65rem;
    }

    .etiqueta-categoria {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 0.55rem;
      font-weight: 800;
      color: var(--cor-categoria, var(--laranja));
      text-transform: uppercase;
      letter-spacing: 0.2px;
      margin-bottom: 4px;
    }

    .etiqueta-categoria .bolinha {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--cor-categoria, var(--laranja));
    }

    .card-topo {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .emoji-produto {
      font-size: 1.6rem;
      background: linear-gradient(145deg, #FFF6E9, #FFEAC8);
      border-radius: 10px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 2px solid var(--queijo);
    }

    .nome-produto {
      font-weight: 800;
      font-size: 0.8rem;
      line-height: 1.1;
    }

    .opiniao-rato {
      background: #FFF3E0;
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 0.65rem;
      color: #7a5636;
      display: flex;
      gap: 4px;
      align-items: flex-start;
      margin-bottom: 8px;
      flex: 1;
      line-height: 1.3;
    }

    .opiniao-rato .rato-icone {
      font-size: 0.8rem;
      flex-shrink: 0;
    }

    .opiniao-rato .autor-rato {
      font-weight: 800;
      color: var(--laranja-escuro);
      display: block;
      margin-bottom: 1px;
      font-size: 0.6rem;
    }

    .precos-produto {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-top: 1px dashed #F0D2AE;
      padding-top: 6px;
      margin-bottom: 6px;
      font-size: 0.6rem;
      color: #a0805f;
    }

    .precos-produto .preco-final {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--laranja-escuro);
      display: block;
    }

    .precos-produto .col-custo {
      text-align: right;
      line-height: 1.2;
    }

    .precos-produto .col-custo b {
      color: var(--verde-ok);
      font-size: 0.58rem;
    }

    .btn-add-carrinho {
      background: var(--laranja);
      color: #fff;
      padding: 7px 6px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.68rem;
      text-align: center;
      transition: 0.15s;
      flex: 1;
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-add-carrinho:active {
      background: var(--laranja-escuro);
      transform: scale(0.95);
    }

    .btn-add-carrinho.adicionado {
      background: var(--verde-ok);
    }

    .linha-acao-card {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .seletor-quantidade {
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--creme);
