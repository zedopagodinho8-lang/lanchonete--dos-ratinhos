<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#E8722A">
  <title>Lanchonete dos Ratinhos 🐭🧀</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --laranja: #E8722A;
      --laranja-escuro: #C4581A;
      --laranja-claro: #FFB672;
      --creme: #FFF6E9;
      --marrom: #5A3A22;
      --queijo: #FFD166;
      --rosa-nariz: #F27A9E;
      --verde-ok: #4C9A5A;
      --cor-paes: #C4712B;
      --cor-doces: #D9628E;
      --cor-bebidas: #3C8FA8;
      --cor-despensa: #6E9B4E;
      --dourado: #E8B23C;
      --cor-suporte: #7C6BAE;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Nunito', sans-serif;
      background: var(--creme);
      color: var(--marrom);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: 'Baloo 2', sans-serif;
      margin: 0;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      border: none;
      background: none;
    }

    input, select, textarea {
      font-size: 16px;
      font-family: inherit;
    }

    /* ========== FAIXA PROMOCIONAL ========== */
    .faixa-promo {
      background: linear-gradient(90deg, var(--marrom), var(--laranja-escuro));
      color: #f3e3d1;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 10px 16px;
      letter-spacing: 0.2px;
      text-align: center;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }

    .faixa-promo::-webkit-scrollbar {
      display: none;
    }

    .faixa-promo span {
      opacity: 0.55;
      margin: 0 8px;
    }

    /* ========== HEADER ========== */
    .topo-fixo {
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header {
      background: linear-gradient(135deg, var(--laranja) 0%, var(--laranja-escuro) 100%);
      color: #fff;
      padding: 14px 16px;
      box-shadow: 0 4px 12px rgba(90,58,34,0.15);
    }

    .header-linha {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Baloo 2', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    .logo .queijo-icone {
      background: var(--queijo);
      color: var(--marrom);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      border: 3px solid #fff;
      flex-shrink: 0;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    }

    .logo small {
      display: block;
      font-family: 'Nunito', sans-serif;
      font-weight: 600;
      font-size: 0.6rem;
      opacity: 0.9;
      letter-spacing: 0.3px;
    }

    nav.acoes {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-nav {
      background: rgba(255,255,255,0.18);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.75rem;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: 0.2s;
      border: 1px solid rgba(255,255,255,0.35);
      min-height: 36px;
    }

    .btn-nav:hover {
      background: rgba(255,255,255,0.28);
    }

    .btn-nav:active {
      transform: scale(0.95);
    }

    .btn-carrinho {
      background: var(--queijo);
      color: var(--marrom);
      border: none;
      position: relative;
      min-width: 44px;
      justify-content: center;
    }

    .btn-carrinho:hover {
      background: #ffcb4d;
    }

    .contador-carrinho {
      position: absolute;
      top: -8px;
      right: -8px;
      background: var(--rosa-nariz);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 800;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .contador-carrinho.pulso {
      animation: pulsoContador 0.45s ease;
    }

    @keyframes pulsoContador {
      0% { transform: scale(1); }
      40% { transform: scale(1.5); background: var(--verde-ok); }
      100% { transform: scale(1); }
    }

    .barra-busca {
      max-width: 1200px;
      margin: 10px auto 0;
      display: flex;
      align-items: center;
      background: #fff;
      border-radius: 999px;
      padding: 9px 16px;
      gap: 8px;
      box-shadow: inset 0 0 0 2px rgba(232,114,42,0.15);
    }

    .barra-busca input {
      border: none;
      outline: none;
      flex: 1;
      font-size: 16px;
      color: var(--marrom);
      background: transparent;
    }

    .barra-busca input::placeholder {
      color: rgba(90,58,34,0.4);
    }

    .barra-busca span {
      color: var(--laranja);
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    /* ========== HERO ========== */
    .hero {
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 16px 20px;
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
    }

    .hero-texto {
      flex: 1 1 300px;
    }

    .aviso-escolar {
      display: inline-block;
      background: #FFEFD9;
      color: var(--laranja-escuro);
      font-weight: 800;
      font-size: 0.68rem;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
      letter-spacing: 0.3px;
      border: 1px dashed var(--laranja);
    }

    .hero-texto h1 {
      font-size: 1.9rem;
      line-height: 1.3;
      margin: 10px 0;
      color: var(--laranja-escuro);
    }

    .hero-texto p {
      font-size: 0.95rem;
      line-height: 1.6;
      max-width: 480px;
      color: rgba(90,58,34,0.8);
    }

    .hero-stats {
      display: flex;
      gap: 16px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .hero-stats .stat {
      display: flex;
      flex-direction: column;
      background: rgba(255,255,255,0.6);
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(232,114,42,0.2);
    }

    .hero-stats .stat b {
      font-size: 1.1rem;
      color: var(--laranja-escuro);
    }

    .hero-stats .stat span {
      font-size: 0.68rem;
      color: rgba(90,58,34,0.7);
    }

    .hero-botoes {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .btn-principal {
      background: linear-gradient(135deg, var(--laranja) 0%, var(--laranja-escuro) 100%);
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.9rem;
      box-shadow: 0 4px 12px rgba(232,114,42,0.3);
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
    }

    .btn-principal:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(232,114,42,0.4);
    }

    .btn-principal:active {
      transform: scale(0.97);
    }

    .btn-secundario {
      background: #fff;
      color: var(--laranja-escuro);
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.9rem;
      border: 2px solid var(--laranja-claro);
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
    }

    .btn-secundario:hover {
      background: #FFF1E0;
      transform: translateY(-2px);
    }

    .btn-secundario:active {
      transform: scale(0.97);
    }

    .hero-mascote {
      flex: 1 1 260px;
      display: flex;
      justify-content: center;
    }

    .balao-mascote {
      background: #fff;
      border-radius: 22px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 12px 28px rgba(90,58,34,0.15);
      border: 3px solid var(--queijo);
      max-width: 300px;
      position: relative;
      animation: flutuar 3.5s ease-in-out infinite;
    }

    @keyframes flutuar {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .balao-mascote .rato-grande {
      font-size: 3.5rem;
      display: block;
      margin-bottom: 6px;
    }

    .balao-mascote strong {
      display: block;
      font-size: 1rem;
      margin-bottom: 4px;
    }

    .balao-mascote p {
      font-size: 0.85rem;
      font-style: italic;
      margin: 4px 0 0;
      color: var(--marrom);
    }

    /* ========== FAIXA DE CONFIANÇA ========== */
    .faixa-confianca {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px 10px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
    }

    .item-confianca {
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 2px 8px rgba(90,58,34,0.08);
      border: 1px solid #FFE6C7;
    }

    .item-confianca .icone-confianca {
      font-size: 2rem;
      margin-bottom: 8px;
    }

    .item-confianca b {
      display: block;
      font-size: 0.8rem;
      color: var(--marrom);
      margin-bottom: 3px;
    }

    .item-confianca span {
      font-size: 0.65rem;
      color: #a0805f;
    }

    /* ========== ABAS ========== */
    .abas-principais {
      background: #fff;
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 8px;
      box-shadow: 0 2px 8px rgba(90,58,34,0.08);
      border-bottom: 1px solid #FFE6C7;
      overflow-x: auto;
      flex-wrap: wrap;
    }

    .aba-item {
      background: transparent;
      color: #a0805f;
      font-weight: 800;
      font-size: 0.8rem;
      padding: 10px 16px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
      border: none;
      min-height: 40px;
      white-space: nowrap;
    }

    .aba-item:hover {
      background: #FFF3E0;
      color: var(--laranja-escuro);
    }

    .aba-item.ativa {
      background: linear-gradient(135deg, var(--laranja) 0%, var(--laranja-escuro) 100%);
      color: #fff;
      box-shadow: 0 4px 12px rgba(232,114,42,0.3);
    }

    .aba-item .aba-emoji {
      font-size: 1rem;
    }

    .conteudo-aba {
      display: none;
    }

    .conteudo-aba.ativa {
      display: block;
      animation: surgirAba 0.3s ease both;
    }

    @keyframes surgirAba {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ========== SEÇÕES ========== */
    section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    .titulo-secao {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .titulo-secao h2 {
      font-size: 1.5rem;
      color: var(--laranja-escuro);
    }

    .subtitulo-secao {
      color: #8a6a4f;
      font-size: 0.88rem;
      margin: 0 0 16px;
    }

    /* ========== FILTROS ========== */
    .barra-ordenar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .barra-ordenar label {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--laranja-escuro);
    }

    .barra-ordenar select {
      padding: 9px 12px;
      border-radius: 8px;
      border: 2px solid #FFE1B8;
      background: #fff;
      color: var(--marrom);
      font-weight: 700;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }

    .barra-ordenar select:focus {
      border-color: var(--laranja);
    }

    .chips-preco {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 14px;
    }

    .chip-preco {
      flex-shrink: 0;
      background: #fff;
      border: 2px solid #E7E0EE;
      color: var(--marrom);
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.76rem;
      transition: 0.2s;
      cursor: pointer;
      white-space: nowrap;
      min-height: 38px;
      display: flex;
      align-items: center;
    }

    .chip-preco:hover {
      border-color: var(--laranja-claro);
    }

    .chip-preco:active {
      transform: scale(0.95);
    }

    .chip-preco.ativo {
      background: var(--marrom);
      border-color: var(--marrom);
      color: #fff;
      box-shadow: 0 4px 12px rgba(90,58,34,0.2);
    }

    .barra-categorias {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 0 14px;
      margin-bottom: 12px;
    }

    .btn-categoria {
      flex-shrink: 0;
      background: #fff;
      border: 2px solid #FFE1B8;
      color: var(--marrom);
      padding: 9px 16px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.8rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
      cursor: pointer;
      white-space: nowrap;
      min-height: 40px;
    }

    .btn-categoria:hover {
      border-color: var(--laranja-claro);
      color: var(--laranja);
    }

    .btn-categoria:active {
      transform: scale(0.95);
    }

    .btn-categoria.ativo {
      background: var(--laranja);
      border-color: var(--laranja);
      color: #fff;
      box-shadow: 0 4px 12px rgba(90,58,34,0.2);
    }

    .btn-categoria .bolinha {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    /* ========== GRID DE PRODUTOS ========== */
    #cardapio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
    }

    .card-produto {
      background: #fff;
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 2px 8px rgba(90,58,34,0.08);
      border: 2px solid #FFE6C7;
      display: flex;
      flex-direction: column;
      transition: 0.2s;
      position: relative;
      overflow: hidden;
      animation: surgirCard 0.3s ease both;
    }

    @keyframes surgirCard {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card-produto::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: var(--cor-categoria, var(--laranja));
    }

    .card-produto:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 16px rgba(90,58,34,0.12);
      border-color: var(--laranja-claro);
    }

    .card-produto:active {
      transform: scale(0.97);
    }

    .selo-destaque {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--dourado);
      color: #5A3A22;
      font-size: 0.6rem;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 999px;
      box-shadow: 0 2px 6px rgba(232,178,60,0.4);
      z-index: 2;
    }

    .avaliacao-produto {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.65rem;
      color: #a0805f;
      margin-bottom: 6px;
    }

    .avaliacao-produto .queijinhos {
      letter-spacing: 0.5px;
      font-size: 0.7rem;
    }

    .etiqueta-categoria {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.58rem;
      font-weight: 800;
      color: var(--cor-categoria, var(--laranja));
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 6px;
    }

    .etiqueta-categoria .bolinha {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cor-categoria, var(--laranja));
    }

    .card-topo {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .emoji-produto {
      font-size: 1.8rem;
      background: linear-gradient(145deg, #FFF6E9, #FFEAC8);
      border-radius: 10px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 2px solid var(--queijo);
    }

    .nome-produto {
      font-weight: 800;
      font-size: 0.8rem;
      line-height: 1.2;
    }

    .opiniao-rato {
      background: #FFF3E0;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 0.7rem;
      color: #7a5636;
      display: flex;
      gap: 6px;
      align-items: flex-start;
      margin-bottom: 10px;
      flex: 1;
      line-height: 1.4;
    }

    .opiniao-rato .rato-icone {
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .opiniao-rato .autor-rato {
      font-weight: 800;
      color: var(--laranja-escuro);
      display: block;
      margin-bottom: 2px;
      font-size: 0.65rem;
    }

    .precos-produto {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-top: 1px dashed #F0D2AE;
      padding-top: 8px;
      margin-bottom: 10px;
      font-size: 0.65rem;
      color: #a0805f;
    }

    .precos-produto .preco-final {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--laranja-escuro);
      display: block;
    }

    .precos-produto .col-custo {
      text-align: right;
      line-height: 1.3;
    }

    .precos-produto .col-custo b {
      color: var(--verde-ok);
    }

    .btn-add-carrinho {
      background: var(--laranja);
      color: #fff;
      padding: 8px 10px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.75rem;
      text-align: center;
      transition: 0.2s;
      flex: 1;
      cursor: pointer;
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-add-carrinho:hover {
      background: var(--laranja-escuro);
    }

    .btn-add-carrinho:active {
      transform: scale(0.95);
    }

    .btn-add-carrinho.adicionado {
      background: var(--verde-ok);
    }

    .linha-acao-card {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .seletor-quantidade {
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--creme);
      border-radius: 8px;
      border: 2px solid #FFE1B8;
      overflow: hidden;
      flex-shrink: 0;
      min-height: 36px;
    }

    .seletor-quantidade button {
      width: 34px;
      height: 34px;
      background: transparent;
      color: var(--laranja-escuro);
      font-weight: 800;
      font-size: 1rem;
      transition: 0.15s;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .seletor-quantidade button:hover {
      background: var(--queijo);
    }

    .seletor-quantidade button:active {
      transform: scale(0.9);
    }

    .seletor-quantidade .qtd-selecionada {
      min-width: 20px;
      text-align: center;
      font-weight: 800;
      font-size: 0.8rem;
      color: var(--marrom);
    }

    #sem-resultado {
      display: none;
      text-align: center;
      padding: 30px;
      color: #a0805f;
      font-weight: 700;
      grid-column: 1 / -1;
    }

    /* ========== FRETE ========== */
    .opcoes-entrega {
      display: grid;
      grid-template-columns: 1fr 1fr;
