<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lanchonete dos Ratinhos 🐭🧀</title>
  <style>
    :root {
      --laranja: #E8722A;
      --laranja-escuro: #C4581A;
      --creme: #FFF6E9;
      --marrom: #5A3A22;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: var(--creme);
      color: var(--marrom);
      font-family: 'Nunito', sans-serif;
    }

    main {
      width: 100%;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      font-family: 'Baloo 2', sans-serif;
      color: var(--laranja-escuro);
    }

    p {
      font-size: 1rem;
    }

    .btn-principal {
      background: linear-gradient(135deg, var(--laranja), var(--laranja-escuro));
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 800;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>Bem-vindo à Lanchonete dos Ratinhos 🐭🧀</h1>
    <p>Agora o conteúdo aparece corretamente sem tela branca ou preta.</p>
    <button class="btn-principal">Fazer Pedido</button>
  </main>
</body>
</html>
